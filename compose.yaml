services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/morosystemsdemo'
      - 'SPRING_DATASOURCE_USERNAME=morosystemsdemodbuser'
      - 'SPRING_DATASOURCE_PASSWORD=morosystemsdemodbpassword'
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=none'
      - 'SPRING_LIQUIBASE_ENABLED=true'
    ports:
      - '8080:8080'

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=morosystemsdemo'
      - 'POSTGRES_PASSWORD=morosystemsdemodbpassword'
      - 'POSTGRES_USER=morosystemsdemodbuser'
    ports:
      - '5432:5432'
